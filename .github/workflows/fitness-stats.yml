name: fitness-stats

on:
  schedule:
    - cron: '17 4 * * *' # nightly, 04:17 UTC
  workflow_dispatch: {} # manual run button, for testing

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch Strava aggregates
        run: node scripts/fetch-strava-stats.mjs
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}

      - name: Commit if changed
        run: |
          git config user.name "fitness-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/content/fitness.json
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "ci: update fitness stats"
          git push
